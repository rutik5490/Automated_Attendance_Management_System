{% extends "admin/change_list.html" %}
{% load i18n admin_urls static admin_list %}

{% block extrahead %}
{{ block.super }}
<style>
:root {
    --primary: #667eea;
    --primary-dark: #764ba2;
    --secondary: #f8f9fa;
    --dark: #212529;
    --light: #f8f9fa;
    --success: #28a745;
    --info: #17a2b8;
    --warning: #ffc107;
    --danger: #dc3545;
}

/* Button Styles */
.add-class-btn {
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
    border: none;
    border-radius: 10px;
    padding: 12px 25px;
    font-weight: 600;
    transition: all 0.3s ease;
    color: white;
    text-decoration: none;
    display: inline-block;
    box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
}

.add-class-btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
    color: white;
}

/* Button container */
.button-container {
    margin-bottom: 20px;
    text-align: right;
}

/* Card styling for the main content */
#content-main {
    background: white;
    border-radius: 15px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
    border: none;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
    padding: 25px;
    margin-bottom: 25px;
}

#content-main:hover {
    transform: translateY(-5px);
    box-shadow: 0 15px 40px rgba(0, 0, 0, 0.15);
}

/* Table styling */
#result_list {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0;
    background: white;
    border-radius: 15px;
    overflow: hidden;
    box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
}

#result_list thead th {
    background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
    color: #495057;
    font-weight: 700;
    padding: 20px 15px;
    border-bottom: 3px solid #dee2e6;
    text-transform: uppercase;
    font-size: 14px;
    letter-spacing: 0.5px;
}

#result_list tbody tr {
    transition: all 0.3s ease;
    border-bottom: 1px solid #eee;
}

#result_list tbody tr:hover {
    background: #f8f9fa;
}

#result_list tbody td {
    padding: 18px 15px;
    border-bottom: 1px solid #eee;
    font-size: 15px;
}

/* Action buttons */
.change-list .row-actions a {
    border-radius: 8px;
    padding: 8px 15px;
    transition: all 0.3s ease;
    text-decoration: none;
    display: inline-block;
    margin: 0 2px;
}

.change-list .row-actions a:hover {
    transform: translateY(-3px);
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
}

/* Search bar styling */
#changelist-search {
    background: white;
    border-radius: 12px;
    padding: 25px;
    box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
    margin-bottom: 25px;
}

#changelist-search input[type="text"] {
    border-radius: 10px;
    border: 2px solid #e9ecef;
    padding: 15px 20px;
    font-size: 16px;
    width: 100%;
    transition: all 0.3s ease;
}

#changelist-search input[type="text"]:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.15);
}

#changelist-search button {
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
    border: none;
    border-radius: 10px;
    padding: 12px 25px;
    font-weight: 600;
    transition: all 0.3s ease;
    color: white;
    box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
}

#changelist-search button:hover {
    transform: translateY(-3px);
    box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
}

/* Pagination styling */
.paginator {
    display: flex;
    justify-content: center;
    margin-top: 30px;
    background: white;
    border-radius: 15px;
    padding: 20px;
    box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
}

.paginator a:link, .paginator a:visited {
    background: white;
    color: var(--primary);
    padding: 12px 18px;
    border-radius: 10px;
    text-decoration: none;
    margin: 0 5px;
    transition: all 0.3s ease;
    border: 1px solid #dee2e6;
}

.paginator a:hover {
    background: var(--primary);
    color: white;
    transform: translateY(-3px);
    box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
}

.paginator .this-page {
    background: var(--primary);
    color: white;
    border-color: var(--primary);
}

/* Responsive adjustments */
@media (max-width: 768px) {
    .button-container {
        text-align: center;
    }
    
    #result_list thead th,
    #result_list tbody td {
        padding: 12px 10px;
        font-size: 14px;
    }
}
</style>
{% endblock %}

{% block content %}
<div class="button-container">
    <a href="{% url 'admin:attendance_class_add' %}" class="add-class-btn">
        <i class="fas fa-plus-circle me-1"></i>Add New Class
    </a>
</div>

{{ block.super }}
{% endblock %}
