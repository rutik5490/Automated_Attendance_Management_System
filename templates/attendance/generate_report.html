{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header">
                <h3>Generate Attendance Report</h3>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="class_id" class="form-label">Select Class (Optional)</label>
                        <select class="form-select" id="class_id" name="class_id">
                            <option value="">All Classes</option>
                            {% for class in classes %}
                                <option value="{{ class.id }}">{{ class.name }} {{ class.year }} {{ class.section }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="format" class="form-label">Report Format</label>
                        <select class="form-select" id="format" name="format">
                            <option value="csv">CSV</option>
                            <option value="excel">Excel</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary">Generate Report</button>
                    <a href="{% url 'faculty_dashboard' %}" class="btn btn-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
